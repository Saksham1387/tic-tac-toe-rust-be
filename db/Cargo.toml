[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = {version = "0.4.42",features = ["serde"]}
rand = "0.9.2"
serde = {version = "1.0.228" , features = ["derive"]}
serde_json = "1.0.149"
snowflake = "1.3.0"
sqlx = {version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid","time"]}
time = {version = "0.3.45",features = ["serde"]}
uuid = {version = "1.19.0",features = ["serde"]}
